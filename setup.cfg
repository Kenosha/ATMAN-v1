[metadata]
name = ATMANpy
version = 0.1.0
description = Automated Tennis Match Annotator
long_description = file: README.md
long_description_content_type = text/markdown
author = Gianluca

[options]
packages = find:
python_requires = >=3.8
install_requires =
    dill
    distinctipy
    fuzzywuzzy
    librosa
    matplotlib
    moviepy
    multipledispatch
    networkx
    noisereduce
    norfair
    numpy
    opencv-python
    pandas
    pedalboard
    Pillow
    psutil
    pytesseract
    scikit-image
    scikit-learn
    scikit-video
    scipy
    seaborn
    sounddevice
    soundfile
    statsmodels
    tensorboard
    torch
    torchaudio
    torchmetrics
    torchsummary
    torchvision
    ultralytics
include_package_data = True

[options.packages.find]
where =
    .
include =
    ATMANpy
    ATMANpy.*

[metadata]
name = ATMANpy
version = 0.1.0
description = Automated Tennis Match Annotator: historical broadcast-video prototype
long_description = file: README.md
long_description_content_type = text/markdown
author = Gianluca
url = https://atman-tennis.com

[options]
packages = find_namespace:
python_requires = >=3.10
install_requires =
    dill>=0.3.8
    matplotlib>=3.8,<4
    multipledispatch>=1
    networkx>=3
    numpy>=1.26,<2
    opencv-python>=4.8,<4.12
    pandas>=2,<3
    Pillow>=10
    psutil>=5
    scikit-learn>=1.4,<2
    scikit-video>=1.1.11
    scipy>=1.11,<2
    seaborn>=0.13,<0.14
    statsmodels>=0.14,<0.15
include_package_data = True

[options.packages.find]
where =
    .
include =
    ATMANpy
    ATMANpy.*
exclude =
    *__pycache__*

[options.package_data]
ATMANpy = auxil/backus_naur_grammars/*.txt

[options.extras_require]
recognition =
    librosa>=0.10,<0.12
    scikit-image>=0.22,<0.26
    sounddevice>=0.4
    soundfile>=0.12
    torch>=2.2,<3
    torchaudio>=2.2,<3
    torchvision>=0.17,<1
legacy =
    fuzzywuzzy==0.18.0
    librosa>=0.10,<0.12
    noisereduce>=3,<4
    pedalboard>=0.9,<0.10
    pytesseract>=0.3
    scikit-image>=0.22,<0.26
    sounddevice>=0.4
    soundfile>=0.12
    tensorboard>=2
    torch>=2.2,<3
    torchaudio>=2.2,<3
    torchmetrics>=1
    torchreid==0.2.5
    torchsummary>=1.5
    torchvision>=0.17,<1
    ultralytics>=8.3,<9
